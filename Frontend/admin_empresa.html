<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Empresas Registradas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: linear-gradient(to right, #f9d423, #ff4e50);
            min-height: 100vh;
        }

        .card {
            border-radius: 1rem;
        }

        .btn-toggle {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <h2 class="text-center mb-4 text-white">Empresas Registradas</h2>
        <div id="empresasContainer" class="row g-4"></div>
    </div>

    <!-- Modal para editar empresa -->
    <div class="modal fade" id="modalEditarEmpresa" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" id="formEditarEmpresa">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Empresa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editId" />

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="editNombre" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">NIT</label>
                        <input type="text" class="form-control" id="editNIT" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Razón Social</label>
                        <input type="text" class="form-control" id="editRazon" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">¿Ha Pagado?</label>
                        <select id="editPago" class="form-select">
                            <option value="true">Sí</option>
                            <option value="false">No</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">¿Está Activa?</label>
                        <select id="editActiva" class="form-select">
                            <option value="true">Sí</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                </div>
            </form>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API = "http://localhost:3001";

        async function cargarEmpresas() {
            try {
                const empresasRes = await fetch(`${API}/api/empresa`);
                const empresas = await empresasRes.json();

                const usuariosRes = await fetch(`${API}/api/usuarios`);
                const usuarios = await usuariosRes.json();

                const container = document.getElementById("empresasContainer");
                container.innerHTML = "";

                empresas.forEach(empresa => {
                    const relacionados = usuarios.filter(u => u.empresa?._id === empresa._id);

                    const card = document.createElement("div");
                    card.className = "col-md-6 col-lg-4";
                    card.innerHTML = `
            <div class="card shadow-sm">
              <div class="card-body">
                <h5 class="card-title">${empresa.nombre}</h5>
                <p class="card-text"><strong>NIT:</strong> ${empresa.nit || "—"}</p>
                <p class="card-text"><strong>Razón Social:</strong> ${empresa.razonSocial || "—"}</p>
                <button class="btn btn-primary btn-sm mb-2" onclick="toggleUsuarios('${empresa._id}')">
                  Ver Usuarios (${relacionados.length})
                </button>
                <ul class="list-group list-group-flush d-none" id="usuarios-${empresa._id}">
                  ${relacionados.length
                            ? relacionados.map(u => `<li class="list-group-item">${u.nombre} (${u.correo})</li>`).join("")
                            : `<li class="list-group-item text-muted">Sin usuarios</li>`
                        }
                </ul>
                <button class="btn btn-secondary btn-sm mt-2" onclick='abrirModalEditar(${JSON.stringify(empresa)})'>
                    ✏️ Editar Empresa
                </button>

                <button class="btn btn-danger btn-sm mt-3" onclick="eliminarEmpresa('${empresa._id}')">
                    🗑 Eliminar Empresa
                </button>
              </div>
            </div>
          `;
                    container.appendChild(card);
                });
            } catch (error) {
                alert("❌ Error al cargar datos");
                console.error(error);
            }
        }

        function toggleUsuarios(id) {
            const lista = document.getElementById("usuarios-" + id);
            lista.classList.toggle("d-none");
        }

        async function eliminarEmpresa(id) {
            if (!confirm("¿Estás seguro de eliminar esta empresa y todos sus datos relacionados?")) return;

            try {
                const res = await fetch(`${API}/api/empresa/${id}`, { method: "DELETE" });
                const data = await res.json();
                if (!res.ok) throw new Error(data.mensaje);
                alert("✅ Empresa eliminada con éxito");
                cargarEmpresas();
            } catch (err) {
                alert("❌ No se pudo eliminar la empresa");
                console.error(err);
            }
        }

        cargarEmpresas();

        const modalEditar = new bootstrap.Modal(document.getElementById('modalEditarEmpresa'));

        function abrirModalEditar(empresa) {
            document.getElementById("editId").value = empresa._id;
            document.getElementById("editNombre").value = empresa.nombre || "";
            document.getElementById("editNIT").value = empresa.nit || "";
            document.getElementById("editRazon").value = empresa.razonSocial || "";
            document.getElementById("editPago").value = String(empresa.pagoRealizado);
            document.getElementById("editActiva").value = String(empresa.activa);
            modalEditar.show();
        }


        document.getElementById("formEditarEmpresa").addEventListener("submit", async (e) => {
            e.preventDefault();

            const id = document.getElementById("editId").value;
            const nombre = document.getElementById("editNombre").value;
            const nit = document.getElementById("editNIT").value;
            const razonSocial = document.getElementById("editRazon").value;
            const pagoRealizado = document.getElementById("editPago").value === "true";
            const activa = document.getElementById("editActiva").value === "true";

            try {
                const res = await fetch(`${API}/api/empresa/${id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nombre, nit, razonSocial, pagoRealizado, activa })
                });

                const data = await res.json();

                if (!res.ok) {
                    alert(data.mensaje || "Error al actualizar");
                    return;
                }

                alert("✅ Empresa actualizada");
                modalEditar.hide();
                cargarEmpresas();
            } catch (err) {
                alert("❌ Error de red o servidor");
                console.error(err);
            }
        });


    </script>
</body>

</html>
