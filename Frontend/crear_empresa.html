<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registrar Nueva Empresa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #fceabb, #f8b500);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      border: none;
      border-radius: 1rem;
      width: 100%;
      max-width: 500px;
    }
  </style>
</head>

<body>
  <div class="card shadow p-4 pt-2 bg-white">
    <h3 class="text-center mb-4">Registro de Empresa</h3>
    <form id="empresaForm">
      <h5 class="mb-3">Datos de la Empresa</h5>
      <div class="mb-3">
        <label for="nombreEmpresa" class="form-label">Nombre de la Empresa</label>
        <input type="text" class="form-control" id="nombreEmpresa" required />
      </div>
      <div class="mb-3">
        <label for="nitEmpresa" class="form-label">NIT</label>
        <input type="text" class="form-control" id="nitEmpresa" required />
      </div>
      <div class="mb-3">
        <label for="razonEmpresa" class="form-label">Razón Social</label>
        <input type="text" class="form-control" id="razonEmpresa" required />
      </div>
      <div class="mb-3">
        <label for="pago" class="form-label">¿Ha Pagado?</label>
        <select id="pago" class="form-select" required>
          <option value="true">Sí</option>
          <option value="false" selected>No</option>
        </select>
      </div>

      <h5 class="mt-4 mb-3">Admin de la Empresa</h5>
      <div class="mb-3">
        <label for="nombreAdmin" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombreAdmin" required />
      </div>
      <div class="mb-3">
        <label for="apellidoAdmin" class="form-label">Apellido</label>
        <input type="text" class="form-control" id="apellidoAdmin" required />
      </div>
      <div class="mb-3">
        <label for="correoAdmin" class="form-label">Correo</label>
        <input type="email" class="form-control" id="correoAdmin" required />
      </div>
      <div class="mb-3">
        <label for="contraseñaAdmin" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="contraseñaAdmin" required />
      </div>

      <button type="submit" class="btn btn-warning w-100">Registrar Empresa y Admin</button>
    </form>
  </div>

  <script>
    document.getElementById("empresaForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const nombre = document.getElementById("nombreEmpresa").value;
      const nit = document.getElementById("nitEmpresa").value;
      const razonSocial = document.getElementById("razonEmpresa").value;
      const pago = document.getElementById("pago").value === "true";
      const estado = pago ? "premium" : "gratis";

      const empresaRes = await fetch("http://localhost:3001/api/empresa", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, nit, razonSocial, estado, activa: true })
      });

      const empresaData = await empresaRes.json();
      if (!empresaRes.ok) {
        alert(empresaData.mensaje || "Error al crear empresa");
        return;
      }

      const empresaId = empresaData.empresa._id;

      const nombreAdmin = document.getElementById("nombreAdmin").value;
      const apellidoAdmin = document.getElementById("apellidoAdmin").value;
      const correoAdmin = document.getElementById("correoAdmin").value;
      const contraseñaAdmin = document.getElementById("contraseñaAdmin").value;

      const usuarioRes = await fetch("http://localhost:3001/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nombre: nombreAdmin,
          apellido: apellidoAdmin,
          correo: correoAdmin,
          contraseña: contraseñaAdmin,
          rol: "Admin",
          empresa: empresaId
        })
      });

      const usuarioData = await usuarioRes.json();

      if (!usuarioRes.ok) {
        alert(usuarioData.mensaje || "Error al registrar el admin");
        return;
      }

      alert("✅ Empresa y usuario admin creados con éxito");
      location.reload();
    });
  </script>
</body>

</html>
